name: Build and Push Frontend Image

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (e.g., v1, v2, 2026-10-27.1)'
        required: true
        default: 'v1'

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="$(date +%Y-%m-%d.%H%M%S)"
          fi
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building image with tag: ${VERSION}"

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/nomori-web:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/nomori-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image tags
        run: |
          echo "✅ Web image pushed successfully!"
          echo ""
          echo "Web: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/nomori-web:${{ steps.version.outputs.tag }}"
          echo ""
          echo "For Azure deployment, use this version tag in your Azure CLI commands:"
          echo "VER=\"${{ steps.version.outputs.tag }}\""
